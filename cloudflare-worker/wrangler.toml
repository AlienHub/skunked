name = "skunked-cloud-api"
main = "src/index.ts"
compatibility_date = "2026-03-07"

# Copy from wrangler.toml.example and fill in your Cloudflare resource IDs.
# Do not commit real D1/KV bindings to version control.

[[d1_databases]]
binding = "EVENTS_DB"
database_name = "skunked-events"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "ACTIVATION_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
MODEL_BASE_URL = "https://api.siliconflow.cn/v1"
MODEL_NAME = "Qwen/Qwen3.5-27B"
MODEL_TIMEOUT_MS = "2500"
